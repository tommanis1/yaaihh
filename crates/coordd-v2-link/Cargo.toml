[package]
name = "coordd-v2-link"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A window's side of coordd-v2's socket: five requests and a terminal's bytes, each reply matched to its request, the watch resumed after a dropped connection"

[dependencies]
base64.workspace = true
coordd-v2-wire = { path = "../coordd-v2-wire" }
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
coordd-v2 = { path = "../coordd-v2" }
docket-v2 = { path = "../docket/v2" }
tokio.workspace = true
