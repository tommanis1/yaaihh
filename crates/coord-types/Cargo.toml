[package]
name = "coord-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# No doc-tests (its doc blocks are text): a doc-test needs the library built a second time, without cfg(test), on
# every test run (N-467).
[lib]
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
docket-machine = { path = "../docket/machine" }
usage-rollup = { path = "../usage-rollup" }
