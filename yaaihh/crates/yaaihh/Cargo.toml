[package]
name = "yaaihh"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
coord-types = { path = "../coord-types" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# our fork of Rune (its yaaihh branch); a local checkout replaces it through a cargo [patch] in .cargo/config.toml
rune = { git = "https://github.com/tommanis1/rune", rev = "16ba1fcc8e43e863968c9a92a3c588631ebdf177", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/tommanis1/rune", rev = "16ba1fcc8e43e863968c9a92a3c588631ebdf177", features = ["markdown"] }
# the model price catalog, for the agents' cost
prices = { path = "../prices" }
chrono = "0.4"
# the agents' terminals, emulated as in their holders (coord-pty)
vt100.workspace = true
# images in chats (base64) and file paths in them (regex)
base64 = "0.22"
regex = "1"
# the tray icon: assets/yaaihh.svg drawn at the tray's size (the version Rune uses)
resvg = { version = "0.45", default-features = false }
