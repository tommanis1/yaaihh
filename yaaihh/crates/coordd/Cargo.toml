[package]
name = "coordd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "coordd"
path = "src/main.rs"

[[bin]]
name = "coordc"
path = "src/client.rs"

[dependencies]
coord-types = { path = "../coord-types" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
libc.workspace = true
chrono = "0.4"
# the policy engine (vault designs/policy-language-draft-2026-11-08.md): clingo, built from source and linked in, so
# the box needs no library of its own
clingo = { version = "0.8", features = ["static-linking"] }
# the policy's LLM calls go to the proxy over plain HTTP
ureq = { version = "3", default-features = false, features = ["json"] }
