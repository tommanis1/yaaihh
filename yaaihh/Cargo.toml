[workspace]
resolver = "3"
members = ["crates/coord-types", "crates/prices", "crates/coordd", "crates/coord-pty", "crates/yaaihh"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.3"
libc = "0.2"
base64 = "0.22"
# the terminal emulator of an agent's terminal, in its holder (coord-pty) and in yaaihh
vt100 = "0.18.1"

# keep builds small: line tables only, no incremental cache for dependencies (disk ran full 7 Nov)
[profile.dev]
debug = "line-tables-only"
incremental = false
